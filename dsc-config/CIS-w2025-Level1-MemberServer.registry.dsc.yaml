    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      valueName: 'RestrictAnonymousSAM'
      valueData:
        DWord: 1
  # Section: 2.3.10
  # Title: Ensure 'Network access: Do not allow anonymous enumeration of SAM accounts and shares' is set to 'Enabled' (MS only)
  - name: '2.3.10.3 - RestrictAnonymous'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      valueName: 'RestrictAnonymous'
      valueData:
        DWord: 1
  # Section: 2.3.10
  # Title: Ensure 'Network access: Let Everyone permissions apply to anonymous users' is set to 'Disabled'
  - name: '2.3.10.5 - EveryoneIncludesAnonymous'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      valueName: 'EveryoneIncludesAnonymous'
      valueData:
        DWord: 0
  # Section: 2.3.10
  # Title: Ensure 'Network access: Named Pipes that can be accessed anonymously' is configured (MS only)
  - name: '2.3.10.7 - NullSessionPipes'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
      valueName: 'NullSessionPipes'
  # Section: 2.3.10
  # Title: Ensure 'Network access: Remotely accessible registry paths' is configured
  - name: '2.3.10.8 - Machine'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths'
      valueName: 'Machine'
  # Section: 2.3.10
  # Title: Ensure 'Network access: Remotely accessible registry paths and sub-paths' is configured
  - name: '2.3.10.9 - Machine'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedPaths'
      valueName: 'Machine'
  # Section: 2.3.10
