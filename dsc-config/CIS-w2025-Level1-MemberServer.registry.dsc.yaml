$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  # Section: 1.1
  # Title: Ensure 'Relax minimum password length limits' is set to 'Enabled'
  - name: '1.1.6 - RelaxMinimumPasswordLengthLimits'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SAM'
      valueName: 'RelaxMinimumPasswordLengthLimits'
      valueData:
        DWord: 1
  # Section: 2.3.1
  # Title: Ensure 'Accounts: Limit local account use of blank passwords to console logon only' is set to 'Enabled'
  - name: '2.3.1.2 - LimitBlankPasswordUse'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      valueName: 'LimitBlankPasswordUse'
  # Section: 2.3.2
  # Title: Ensure 'Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings' is set to 'Enabled'
  - name: '2.3.2.1 - SCENoApplyLegacyAuditPolicy'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      valueName: 'SCENoApplyLegacyAuditPolicy'
      valueData:
        DWord: 1
  # Section: 2.3.2
  # Title: Ensure 'Audit: Shut down system immediately if unable to log security audits' is set to 'Disabled'
  - name: '2.3.2.2 - CrashOnAuditFail'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      valueName: 'CrashOnAuditFail'
      valueData:
        DWord: 0
  # Section: 2.3.4
  # Title: Ensure 'Devices: Prevent users from installing printer drivers' is set to 'Enabled'
  - name: '2.3.4.1 - AddPrinterDrivers'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
      valueName: 'AddPrinterDrivers'
      valueData:
        DWord: 1
  # Section: 2.3.6
  # Title: Ensure 'Domain member: Digitally encrypt or sign secure channel data (always)' is set to 'Enabled'
  - name: '2.3.6.1 - RequireSignOrSeal'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      valueName: 'RequireSignOrSeal'
      valueData:
        DWord: 1
  # Section: 2.3.6
  # Title: Ensure 'Domain member: Digitally encrypt secure channel data (when possible)' is set to 'Enabled'
  - name: '2.3.6.2 - SealSecureChannel'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      valueName: 'SealSecureChannel'
      valueData:
        DWord: 1
  # Section: 2.3.6
  # Title: Ensure 'Domain member: Digitally sign secure channel data (when possible)' is set to 'Enabled'
  - name: '2.3.6.3 - SignSecureChannel'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      valueName: 'SignSecureChannel'
      valueData:
        DWord: 1
  # Section: 2.3.6
  # Title: Ensure 'Domain member: Disable machine account password changes' is set to 'Disabled'
  - name: '2.3.6.4 - DisablePasswordChange'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      valueName: 'DisablePasswordChange'
      valueData:
        DWord: 0
  # Section: 2.3.6
  # Title: Ensure 'Domain member: Maximum machine account password age' is set to '30 or fewer days, but not 0'
  - name: '2.3.6.5 - MaximumPasswordAge'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\Netlogon\Parameters'
      valueName: 'MaximumPasswordAge'
  # Section: 2.3.6
  # Title: Ensure 'Domain member: Require strong (Windows 2000 or later) session key' is set to 'Enabled'
  - name: '2.3.6.6 - RequireStrongKey'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      valueName: 'RequireStrongKey'
      valueData:
        DWord: 1
  # Section: 2.3.7
  # Title: Ensure 'Interactive logon: Don't display last signed-in' is set to 'Enabled'
  - name: '2.3.7.2 - DontDisplayLastUserName'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      valueName: 'DontDisplayLastUserName'
      valueData:
        DWord: 1
  # Section: 2.3.7
  # Title: Ensure 'Interactive logon: Machine inactivity limit' is set to '900 or fewer second(s), but not 0'
  - name: '2.3.7.3 - InactivityTimeoutSecs'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      valueName: 'InactivityTimeoutSecs'
  # Section: 2.3.7
  # Title: Configure 'Interactive logon: Message text for users attempting to log on'
  - name: '2.3.7.4 - LegalNoticeText'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      valueName: 'LegalNoticeText'
      valueData:
        String: 'text'
  # Section: 2.3.7
  # Title: Configure 'Interactive logon: Message title for users attempting to log on'
  - name: '2.3.7.5 - LegalNoticeCaption'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      valueName: 'LegalNoticeCaption'
      valueData:
        String: 'text'
  # Section: 2.3.7
  # Title: Ensure 'Interactive logon: Prompt user to change password before expiration' is set to 'between 5 and 14 days'
  - name: '2.3.7.7 - PasswordExpiryWarning'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      valueName: 'PasswordExpiryWarning'
  # Section: 2.3.7
  # Title: Ensure 'Interactive logon: Require Domain Controller Authentication to unlock workstation' is set to 'Enabled' (MS only)
  - name: '2.3.7.8 - ForceUnlockLogon'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      valueName: 'ForceUnlockLogon'
      valueData:
        DWord: 1
  # Section: 2.3.7
  # Title: Ensure 'Interactive logon: Smart card removal behavior' is set to 'Lock Workstation' or higher
  - name: '2.3.7.9 - ScRemoveOption'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      valueName: 'ScRemoveOption'
      valueData:
        String: '1'
  # Section: 2.3.8
  # Title: Ensure 'Microsoft network client: Digitally sign communications (always)' is set to 'Enabled'
  - name: '2.3.8.1 - RequireSecuritySignature'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      valueName: 'RequireSecuritySignature'
      valueData:
        DWord: 1
  # Section: 2.3.8
  # Title: Ensure 'Microsoft network client: Send unencrypted password to third-party SMB servers' is set to 'Disabled'
  - name: '2.3.8.2 - EnablePlainTextPassword'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      valueName: 'EnablePlainTextPassword'
      valueData:
        DWord: 0
  # Section: 2.3.9
  # Title: Ensure 'Microsoft network server: Amount of idle time required before suspending session' is set to '15 or fewer minute(s)'
  - name: '2.3.9.1 - AutoDisconnect'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
      valueName: 'AutoDisconnect'
  # Section: 2.3.9
  # Title: Ensure 'Microsoft network server: Digitally sign communications (always)' is set to 'Enabled'
  - name: '2.3.9.2 - RequireSecuritySignature'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
      valueName: 'RequireSecuritySignature'
      valueData:
        DWord: 1
  # Section: 2.3.9
  # Title: Ensure 'Microsoft network server: Disconnect clients when logon hours expire' is set to 'Enabled'
  - name: '2.3.9.3 - enableforcedlogoff'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
      valueName: 'enableforcedlogoff'
      valueData:
        DWord: 1
  # Section: 2.3.9
  # Title: Ensure 'Microsoft network server: Server SPN target name validation level' is set to 'Accept if provided by client' or higher (MS only)
  - name: '2.3.9.4 - SMBServerNameHardeningLevel'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
      valueName: 'SMBServerNameHardeningLevel'
      valueData:
        DWord: 1
  # Section: 2.3.10
  # Title: Ensure 'Network access: Do not allow anonymous enumeration of SAM accounts' is set to 'Enabled' (MS only)
  - name: '2.3.10.2 - RestrictAnonymousSAM'
