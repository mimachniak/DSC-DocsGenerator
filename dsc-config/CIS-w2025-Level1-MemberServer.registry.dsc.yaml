  - name: '2.3.10.10 - RestrictNullSessAccess'
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
      valueName: 'RestrictNullSessAccess'
      valueData:
        DWord: 1
  # Section: 2.3.10
